<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المطعم المصري</title>
<meta name="theme-color" content="#ff6b00">
<style>
:root{--primary:#ff6b00;--bg-color:#f8f9fa;--card-bg:#ffffff;--text-color:#333;--nav-bg:#ffffff;--border-color:#ddd}
[data-theme="dark"]{--primary:#ff8533;--bg-color:#121212;--card-bg:#1e1e1e;--text-color:#f1f1f1;--nav-bg:#1a1a1a;--border-color:#333}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:var(--bg-color);color:var(--text-color);padding-bottom:70px}
.header{position:sticky;top:0;z-index:1000;background:var(--primary);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.brand-title{font-weight:bold;font-size:16px}
.cart-badge{background:#fff;color:var(--primary);padding:5px 12px;border-radius:20px;font-weight:bold;font-size:13px;cursor:pointer}
.hero{position:relative;height:160px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-text{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.65);color:#fff;padding:8px 16px;border-radius:12px;font-size:14px}
.search-box{padding:12px 15px 0 15px}
.search-box input{width:100%;padding:10px 14px;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);border-radius:10px;outline:none}
.closed-banner{background:#e74c3c;color:white;text-align:center;padding:10px;font-weight:bold;font-size:13px;display:none}
.page{display:none}.page.active{display:block}
.category-title{background:var(--card-bg);color:var(--primary);padding:10px 15px;margin-top:15px;font-size:15px;font-weight:bold;border-right:5px solid var(--primary);border-top:1px solid var(--border-color);border-bottom:1px solid var(--border-color)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.05);display:flex;flex-direction:column}
.card img{width:100%;height:110px;object-fit:cover;background:#eee}
.card-body{padding:10px;text-align:center;flex-grow:1;display:flex;flex-direction:column;justify-content:space-between}
.card-title{font-size:14px;font-weight:bold;margin-bottom:4px}
.price{color:var(--primary);font-weight:bold;font-size:14px;margin:6px 0}
.size-select{width:100%;padding:6px;margin-bottom:8px;border:1px solid var(--border-color);border-radius:8px;font-size:12px}
.add-btn{background:var(--primary);color:#fff;border:none;width:100%;padding:9px;border-radius:10px;cursor:pointer;font-weight:bold;font-size:13px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav-bg);display:flex;justify-content:space-around;padding:8px 0;box-shadow:0 -3px 15px rgba(0,0,0,.08);z-index:2000;border-top:1px solid var(--border-color)}
.bottom-nav div{text-align:center;font-size:10px;color:#888;cursor:pointer;flex:1}
.bottom-nav div span{font-size:16px;display:block;margin-bottom:2px}
.bottom-nav div.active{color:var(--primary);font-weight:bold}
.form-box{background:var(--card-bg);border:1px solid var(--border-color);margin:15px;padding:16px;border-radius:16px}
.form-box label{font-size:13px;font-weight:bold;display:block;margin-top:8px}
.form-box input,.form-box textarea,.form-box select{width:100%;padding:10px;margin:4px 0 8px 0;border:1px solid var(--border-color);background:var(--card-bg);color:var(--text-color);border-radius:10px;outline:none;font-size:14px}
.cart-item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border-color)}
.qty-controls{display:flex;align-items:center;gap:8px}
.qty-btn{width:28px;height:28px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;color:#fff}
.order-card{padding:14px;margin:10px 15px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;border-right:6px solid #ff6b00}
#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#2ecc71;color:#fff;padding:10px 24px;border-radius:30px;font-size:14px;font-weight:bold;display:none;z-index:5000;text-align:center}
</style>
</head>
<body>
<div id="toast"></div>
<div id="closedBanner" class="closed-banner">🔴 المطعم مغلق حالياً</div>
<div class="header">
  <div class="brand-title" id="customerStoreName">المطعم المصري</div>
  <div class="cart-badge" onclick="showPage('cart')">🛒 (<span id="count">0</span>) <span id="total">0</span> ج</div>
</div>

<div id="page-home" class="page active">
  <div class="hero"><img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600"><div class="hero-text"><h3>الاكل الاصلي</h3></div></div>
  <div class="search-box"><input type="text" id="searchInput" placeholder="🔍 ابحث عن صنف..." onkeyup="filterMenu()"></div>
  <h3 style="padding:12px 15px 0 15px;font-size:15px;">⭐ المنيو المقترح</h3>
  <div class="menu-grid" id="homeMenu">جاري التحميل...</div>
</div>

<div id="page-menu" class="page"><h2 style="padding:15px 15px 0 15px;font-size:18px;">🔥 المنيو والأقسام</h2><div class="search-box"><input type="text" id="searchInputFull" placeholder="🔍 ابحث في القائمة..." onkeyup="filterMenuFull()"></div><div id="fullMenuContainer"></div></div>
<div id="page-cart" class="page"><h2 style="padding:15px 15px 0 15px;font-size:18px;">🛒 سلة الطلبات</h2><div class="form-box" id="cartItems">السلة فارغة حالياً</div><div class="form-box"><label>📝 ملاحظات:</label><textarea id="orderNotes" rows="2"></textarea><div style="display:flex;justify-content:space-between;"><span>الإجمالي:</span><b style="color:var(--primary);"><span id="modalTotal">0</span> جنيه</b></div><br><button id="orderBtn" class="add-btn" style="background:#25D366;" onclick="orderWhats()">تأكيد الطلب واتساب 📱</button></div></div>
<div id="page-account" class="page"><h2 style="padding:15px 15px 0 15px;font-size:18px;">👤 بيانات التوصيل</h2><div class="form-box"><label>الاسم رباعي:</label><input id="nameInput"><label>رقم الموبايل:</label><input id="phoneInput"><label>المنطقة والشارع:</label><input id="addressInput"><label>العمارة والشقة:</label><input id="buildingInput"><button type="button" class="add-btn" style="background:#27ae60;margin-top:12px;" onclick="getMyLocation()">📍 تحديد الموقع تلقائياً</button><button class="add-btn" onclick="saveAccount()" style="margin-top:14px;">حفظ البيانات ✅</button></div></div>
<div id="page-orders" class="page"><h2 style="padding:15px 15px 0 15px;font-size:18px;">📋 سجل طلباتي</h2><div id="ordersList" class="form-box">ادخل رقمك في حسابي لعرض طلباتك</div></div>
<div id="page-settings" class="page"><h2 style="padding:15px 15px 0 15px;font-size:18px;">⚙️ الإعدادات</h2><div class="form-box"><label>المظهر:</label><select id="themeSelect" onchange="changeTheme(this.value)"><option value="light">نهاري ☀️</option><option value="dark">ليلي 🌙</option></select><label style="margin-top:15px;">عرض المنيو:</label><select id="viewStyleSelect" onchange="changeViewStyle(this.value)"><option value="grid">شبكي</option><option value="list">قائمة</option></select></div></div>

<div class="bottom-nav">
  <div id="nav-home" class="active" onclick="showPage('home')"><span>🏠</span>الرئيسية</div>
  <div id="nav-menu" onclick="showPage('menu')"><span>🍛</span>المنيو</div>
  <div id="nav-cart" onclick="showPage('cart')"><span>🛒</span>السلة</div>
  <div id="nav-account" onclick="showPage('account')"><span>👤</span>حسابي</div>
  <div id="nav-orders" onclick="showPage('orders')"><span>📋</span>طلباتي</div>
  <div id="nav-settings" onclick="showPage('settings')"><span>⚙️</span>الإعدادات</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig={databaseURL:"https://apdowebsite-99ed7-default-rtdb.europe-west1.firebasedatabase.app/"};
let db=null; try{if(!firebase.apps.length) firebase.initializeApp(firebaseConfig); db=firebase.database();}catch(e){console.log(e);}
let allItems=[],cart={},restaurantPhone="201148041323",isStoreOpen=true;
function showPage(p){document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));document.getElementById('page-'+p)?.classList.add('active');document.querySelectorAll('.bottom-nav div').forEach(e=>e.classList.remove('active'));document.getElementById('nav-'+p)?.classList.add('active');if(p==='orders') renderOrders(); window.scrollTo(0,0);}
if(db){
 db.ref('settings/storeName').on('value',s=>{const n=s.val()||'المطعم المصري'; const el=document.getElementById('customerStoreName'); if(el) el.innerText=n; document.title=n;});
 db.ref('settings/isOpen').on('value',s=>{isStoreOpen=s.exists()?s.val():true; document.getElementById('closedBanner').style.display=isStoreOpen?'none':'block';});
 db.ref('menu').on('value',s=>{const d=s.val(); allItems=d?(Array.isArray(d)?d.filter(x=>x):Object.values(d)):[]; renderMenuPages();});
 db.ref('settings/wa').on('value',s=>{if(s.exists()) restaurantPhone=s.val();});
}
function cardHTML(it,idx){
 const name=it.name||'صنف'; const img=it.img||'https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=400';
 let priceHTML="", actionBtn="";
 if(it.sizes && Object.keys(it.sizes).length>0){
   let opt=Object.entries(it.sizes).map(([s,p])=>`<option value="${s}:${p}">${s} - ${p}ج</option>`).join('');
   priceHTML=`<select class="size-select" id="size_sel_${idx}">${opt}</select>`;
   actionBtn=`<button class="add-btn" onclick="addSizedToCart(${idx})">+ إضافة</button>`;
 }else{
   priceHTML=`<div class="price">${it.price||0} ج</div>`;
   actionBtn=`<button class="add-btn" onclick="addToCartByIdx(${idx})">+ إضافة</button>`;
 }
 return `<div class="card"><img src="${img}"><div class="card-body"><div class="card-title">${name}</div>${priceHTML}${actionBtn}</div></div>`;
}
function renderMenuPages(list=allItems){
 const homeEl=document.getElementById('homeMenu'), fullEl=document.getElementById('fullMenuContainer');
 if(homeEl) homeEl.innerHTML=list.map((it,i)=>cardHTML(it,i)).join('')||'لا توجد نتائج';
 let fullHTML=""; const cats=["طواجن ورئيسي","أكلات بحرية","مشويات","مقبلات","حلويات","مشروبات ساخنة","مشروبات ساقعة"];
 cats.forEach(cat=>{const fil=list.map((it,idx)=>({...it,idx})).filter(it=>it.category===cat); if(fil.length>0){fullHTML+=`<div class="category-title">📂 ${cat}</div><div class="menu-grid">`+fil.map(it=>cardHTML(it,it.idx)).join('')+`</div>`;}});
 if(fullEl) fullEl.innerHTML=fullHTML||'<p style="text-align:center;padding:20px;">لا توجد أصناف</p>';
}
function filterMenu(){const q=document.getElementById('searchInput').value.toLowerCase(); renderMenuPages(allItems.filter(i=>i.name&&i.name.toLowerCase().includes(q)));}
function filterMenuFull(){const q=document.getElementById('searchInputFull').value.toLowerCase(); renderMenuPages(allItems.filter(i=>i.name&&i.name.toLowerCase().includes(q)));}
function addToCartByIdx(idx){const it=allItems[idx]; if(it) addToCart(it.name, it.price||0);}
function addSizedToCart(idx){const sel=document.getElementById(`size_sel_${idx}`); const it=allItems[idx]; if(sel&&it){const [s,p]=sel.value.split(':'); addToCart(`${it.name} (${s})`, parseFloat(p));}}
function addToCart(name,price){cart[name]=cart[name]?{price,quantity:cart[name].quantity+1}:{price,quantity:1}; updateCartUI(); showToast(`تمت إضافة ${name}`);}
function changeQty(name,amt){if(cart[name]){cart[name].quantity+=amt; if(cart[name].quantity<=0) delete cart[name]; updateCartUI();}}
function updateCartUI(){let c=0,t=0,h=""; Object.keys(cart).forEach(k=>{c+=cart[k].quantity; t+=cart[k].price*cart[k].quantity; h+=`<div class="cart-item-row"><div><b>${k}</b><br><small>${cart[k].price} ج</small></div><div class="qty-controls"><button class="qty-btn" style="background:#e74c3c" onclick="changeQty('${k}',-1)">-</button><b>${cart[k].quantity}</b><button class="qty-btn" style="background:#27ae60" onclick="changeQty('${k}',1)">+</button></div></div>`;}); document.getElementById('count').innerText=c; document.getElementById('total').innerText=t; document.getElementById('modalTotal').innerText=t; document.getElementById('cartItems').innerHTML=h||"السلة فارغة حالياً";}
function showToast(t){const el=document.getElementById('toast'); el.innerText=t; el.style.display='block'; setTimeout(()=>el.style.display='none',3000);}
function loadUserData(){const u=JSON.parse(localStorage.getItem('user_data')||'{}'); if(u.name) document.getElementById('nameInput').value=u.name; if(u.phone) document.getElementById('phoneInput').value=u.phone; if(u.address) document.getElementById('addressInput').value=u.address; if(u.building) document.getElementById('buildingInput').value=u.building;}
function saveAccount(){const n=document.getElementById('nameInput').value.trim(); const p=document.getElementById('phoneInput').value.trim(); const a=document.getElementById('addressInput').value.trim(); const b=document.getElementById('buildingInput').value.trim(); localStorage.setItem('user_data',JSON.stringify({name:n,phone:p,address:a,building:b})); showToast("تم الحفظ ✅");}
function getMyLocation(){if(!navigator.geolocation){alert("لا يدعم"); return;} navigator.geolocation.getCurrentPosition(pos=>{const link=`https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`; let u=JSON.parse(localStorage.getItem('user_data')||'{}'); u.geoLink=link; localStorage.setItem('user_data',JSON.stringify(u)); showToast("تم جلب الموقع ✅");});}
function orderWhats(){const keys=Object.keys(cart); if(keys.length===0) return alert("السلة فارغة!"); const user=JSON.parse(localStorage.getItem('user_data')||'{}'); if(!user.name||!user.phone){alert("اكمل بياناتك في حسابي"); showPage('account'); return;} let tot=0,msg=`*طلب جديد*\n\n`; keys.forEach(k=>{msg+=`• ${k} × ${cart[k].quantity}\n`; tot+=cart[k].price*cart[k].quantity;}); msg+=`\nالإجمالي: ${tot} ج\nالاسم: ${user.name}\nالهاتف: ${user.phone}\nالعنوان: ${user.address}`; if(db) db.ref('orders').push({customer:user,items:cart,total:tot,status:"قيد الانتظار",date:new Date().toLocaleString('ar-EG'),timestamp:Date.now()}); window.open(`https://wa.me/${restaurantPhone}?text=${encodeURIComponent(msg)}`,'_blank'); cart={}; updateCartUI();}
function renderOrders(){const user=JSON.parse(localStorage.getItem('user_data')||'{}'); if(!user.phone){document.getElementById('ordersList').innerHTML="ادخل رقمك في حسابي"; return;} if(!db) return; db.ref('orders').on('value',snap=>{const data=snap.val()||{}; let html=""; Object.keys(data).reverse().forEach(k=>{const o=data[k]; if(o.customer?.phone===user.phone){html+=`<div class="order-card"><b>طلب #${k.slice(-4)}</b> - ${o.status}<br>${o.date}<br>الإجمالي: ${o.total}</div>`;}}); document.getElementById('ordersList').innerHTML=html||"لا توجد طلبات";});}
</script>
</body>
</html>
